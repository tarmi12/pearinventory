<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคลังสินค้า - Pear Inventory</title>
  
  <!-- 1. ดึง Tailwind CSS สำหรับจัดการสไตล์ -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. ดึง React และ ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 3. ดึง Babel เพื่อแปลงโค้ด JSX บนเบราว์เซอร์ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. ดึง Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- ฟอนต์ภาษาไทยและฟอนต์ตัวเลข -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F6F5F1; color: #1F2A24; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .title-font { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- โค้ด React อยู่ในสคริปต์ประเภท text/babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ⚠️ ใส่ Web App URL ของ Google Apps Script ของคุณที่นี่
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzWBYTh_hX4LqWJVccv92iEFIlh2ccdQONP5ru9aSqmrLP4r9xAJqiH_oc4ck0cvY7qbA/exec";

    const DEFAULT_PRODUCTS = [
      { id: "p1",  category: "น้ำมันพืช",  name: "เกสร",       type: "ถุง", size: "1 ลิตร",   pack: 12, barcode: "8851494007530" },
      { id: "p2",  category: "น้ำมันพืช",  name: "เกสร",       type: "ขวด", size: "1 ลิตร",   pack: 12, barcode: "8851494007523" },
      { id: "p3",  category: "น้ำมันพืช",  name: "เกสร",       type: "ขวด", size: "1/2 ลิตร", pack: 24, barcode: "8851494007547" },
      { id: "p4",  category: "น้ำมันพืช",  name: "เกสร",       type: "ขวด", size: "1/4 ลิตร", pack: 48, barcode: "8851494007561" },
      { id: "p5",  category: "น้ำมันพืช",  name: "โอลีน",      type: "ขวด", size: "1 ลิตร",   pack: 12, barcode: "" },
      { id: "p6",  category: "น้ำมันพืช",  name: "โอลีน",      type: "ขวด", size: "1/2 ลิตร", pack: 24, barcode: "" },
      { id: "p7",  category: "น้ำมันพืช",  name: "โอลีน",      type: "ขวด", size: "1/4 ลิตร", pack: 48, barcode: "" },
      { id: "p8",  category: "น้ำตาลทราย", name: "มิตรผล",     type: "ขาว", size: "1 กิโลกรัม", pack: 25, barcode: "" },
      { id: "p9",  category: "น้ำตาลทราย", name: "มิตรผล",     type: "แดง", size: "1 กิโลกรัม", pack: 25, barcode: "" },
      { id: "p10", category: "น้ำตาลทราย", name: "วังขนาย",    type: "ขาว", size: "1 กิโลกรัม", pack: 25, barcode: "" },
      { id: "p11", category: "น้ำตาลทราย", name: "วังขนาย",    type: "แดง", size: "1 กิโลกรัม", pack: 25, barcode: "" },
      { id: "p12", category: "น้ำตาลทราย", name: "ไม่มียี่ห้อ", type: "ขาว", size: "1 กิโลกรัม", pack: 50, barcode: "" },
      { id: "p13", category: "น้ำตาลทราย", name: "ไม่มียี่ห้อ", type: "แดง", size: "1 กิโลกรัม", pack: 50, barcode: "" },
    ];

    const WAREHOUSES = [1, 2, 3, 4, 5, 6];
    const fmt = (n) => (Number.isFinite(n) ? n.toLocaleString("th-TH") : "0");
    const fmtMoney = (n) => Number.isFinite(n) ? n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
    const today = () => new Date().toISOString().slice(0, 10);

    function InventoryApp() {
      const [products] = useState(DEFAULT_PRODUCTS);
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saveError, setSaveError] = useState(null);
      const [tab, setTab] = useState("dashboard");
      const [query, setQuery] = useState("");

      // ดึงข้อมูลจาก Google Sheets
      const fetchTransactions = useCallback(async () => {
        try {
          setLoading(true);
          const res = await fetch(GAS_API_URL);
          const data = await res.json();
          if (data.status === "success" && Array.isArray(data.transactions)) {
            setTransactions(data.transactions);
          }
        } catch (e) {
          setSaveError("ไม่สามารถเชื่อมต่อกับ Google Sheets ได้");
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        if (GAS_API_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
          fetchTransactions();
        } else {
          setLoading(false);
        }
      }, [fetchTransactions]);

      // คำนวณยอดคงเหลือ
      const balances = useMemo(() => {
        const b = {};
        for (const p of products) {
          b[p.id] = {};
          for (const w of WAREHOUSES) {
            b[p.id][w] = { qtyIn: 0, qtyOut: 0, remaining: 0, value: 0 };
          }
        }
        const sortedTx = [...transactions].reverse();
        for (const t of sortedTx) {
          if (!b[t.productId]) continue;
          const cell = b[t.productId][t.warehouse];
          if (!cell) continue;
          const qty = Number(t.qty) || 0;
          const cost = Number(t.cost) || 0;
          if (t.type === "in") {
            cell.qtyIn += qty;
            cell.remaining += qty;
            cell.value += qty * cost;
          } else if (t.type === "out") {
            cell.qtyOut += qty;
            const avgCost = cell.remaining > 0 ? cell.value / cell.remaining : 0;
            cell.remaining = Math.max(0, cell.remaining - qty);
            cell.value = Math.max(0, cell.value - (qty * avgCost));
          }
        }
        return b;
      }, [products, transactions]);

      const totals = useMemo(() => {
        const t = {};
        for (const p of products) {
          let remaining = 0, value = 0;
          for (const w of WAREHOUSES) {
            remaining += balances[p.id][w].remaining;
            value += balances[p.id][w].value;
          }
          t[p.id] = { remaining, value };
        }
        return t;
      }, [products, balances]);

      const grandTotalRemaining = useMemo(() => Object.values(totals).reduce((s, x) => s + x.remaining, 0), [totals]);

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center">
            <div className="text-amber-700 font-mono text-lg animate-pulse">กำลังโหลดข้อมูลคลังสินค้า...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-10">
          <!-- Header -->
          <header className="flex items-center justify-between px-6 py-4 bg-white border-b border-stone-200">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-lg bg-stone-900 flex items-center justify-center text-white font-bold">
                📦
              </div>
              <div>
                <h1 className="title-font font-bold text-lg">Pear Inventory</h1>
                <p className="text-xs text-stone-500">ระบบจัดการคลังสินค้า · 6 โกดัง</p>
              </div>
            </div>
            {saveError && <div className="text-red-600 text-xs font-medium">{saveError}</div>}
          </header>

          <!-- Navigation Tab -->
          <nav className="flex gap-2 px-6 py-3 bg-white border-b border-stone-200 overflow-x-auto">
            <button 
              onClick={() => setTab("dashboard")} 
              className={`px-4 py-2 rounded-lg text-sm font-medium border ${tab === 'dashboard' ? 'bg-stone-900 text-white border-stone-900' : 'bg-stone-100 text-stone-600 border-stone-200'}`}>
              ภาพรวม
            </button>
            {WAREHOUSES.map((w) => (
              <button 
                key={w} 
                onClick={() => setTab(w)} 
                className={`px-4 py-2 rounded-lg text-sm font-medium border mono ${tab === w ? 'bg-amber-700 text-white border-amber-700' : 'bg-stone-100 text-stone-600 border-stone-200'}`}>
                โกดัง {String(w).padStart(2, "0")}
              </button>
            ))}
          </nav>

          <!-- Main Content Area -->
          <main className="max-w-5xl mx-auto p-6">
            {tab === "dashboard" && (
              <div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                  <div className="bg-white p-4 rounded-xl border border-stone-200">
                    <div className="text-xs text-stone-500 mb-1">รายการสินค้าทั้งหมด</div>
                    <div className="title-font font-bold text-2xl">{products.length} SKU</div>
                  </div>
                  <div className="bg-white p-4 rounded-xl border border-stone-200">
                    <div className="text-xs text-stone-500 mb-1">ยอดคงเหลือรวมทุกโกดัง</div>
                    <div className="title-font font-bold text-2xl text-emerald-800">{fmt(grandTotalRemaining)} หน่วย</div>
                  </div>
                </div>

                <!-- Product Table -->
                <div className="bg-white border border-stone-200 rounded-xl overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-right">
                      <thead className="bg-stone-50 border-b border-stone-200 text-stone-500 text-xs uppercase">
                        <tr>
                          <th className="p-3 text-left">สินค้า</th>
                          {WAREHOUSES.map(w => <th key={w} className="p-3">ค.{w}</th>)}
                          <th className="p-3 bg-amber-50">รวม</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100 mono">
                        {products.map(p => (
                          <tr key={p.id}>
                            <td className="p-3 text-left font-sans">
                              <div className="font-semibold text-stone-900">{p.name} <span className="text-stone-400 font-normal">· {p.type}</span></div>
                              <div className="text-xs text-stone-400">{p.category} · {p.size}</div>
                            </td>
                            {WAREHOUSES.map(w => (
                              <td key={w} className="p-3">{fmt(balances[p.id][w].remaining)}</td>
                            ))}
                            <td className="p-3 font-bold bg-amber-50">{fmt(totals[p.id].remaining)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<InventoryApp />);
  </script>

</body>
</html>
